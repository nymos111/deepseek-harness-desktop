<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="splash">
      <div class="row">
        <img class="logo" src="../../assets/icon.png" alt="" width="48" height="48" />
        <div class="col">
          <h1>DeepSeek Harness</h1>
          <p class="status"><span class="spinner" aria-hidden="true"></span><span id="status">Запуск движка…</span></p>
          <p class="hint" id="hint">Первый запуск с плагинами может занять до минуты.</p>
          <p class="hint" id="note" hidden></p>
        </div>
      </div>
      <div class="foot">
        <span id="meta"></span>
        <span id="timer"></span>
      </div>
      <div class="progress"><span class="bar"></span></div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
