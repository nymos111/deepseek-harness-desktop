<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="splash">
      <img class="logo" src="../../assets/icon.png" alt="" />
      <h1>DeepSeek Harness</h1>
      <p class="status"><span class="spinner"></span><span id="status">Запуск движка…</span></p>
      <p class="hint" id="hint">Поднимается локальный сервер DeepSeek Harness. Первый запуск с плагинами может занять до минуты.</p>
      <p class="hint note" id="note" hidden></p>
      <div class="foot">
        <span id="meta">DeepSeek Harness</span>
        <span id="timer"></span>
      </div>
      <div class="progress"></div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
