name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r f; do node --check "$f"; done < <(git ls-files '*.js')
      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r f; do bash -n "$f"; done < <(git ls-files '*.sh')
      - name: package.json is valid JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"
